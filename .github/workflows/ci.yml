name: CI Backend

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build e Testes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build e testes
        run: ./mvnw -B verify

      - name: Resumo dos testes
        if: always()
        run: |
          echo "### Testes executados" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          for kind in surefire failsafe; do
            dir="target/${kind}-reports"
            if [ -d "$dir" ]; then
              total=$(grep -ho 'tests="[0-9]*"' "$dir"/TEST-*.xml 2>/dev/null \
                      | grep -o '[0-9]*' | awk '{s+=$1} END {print s+0}')
              echo "- **${kind}**: ${total} testes" >> $GITHUB_STEP_SUMMARY
            else
              echo "- **${kind}**: nenhum relatorio gerado" >> $GITHUB_STEP_SUMMARY
            fi
          done

      - name: Publicar relatorios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          retention-days: 7
          if-no-files-found: ignore

  format:
    name: Formatacao
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Verificar formatacao
        run: ./mvnw -B spotless:check