spring.application.name=conectaPro-api

server.port=${PORT:8080}
spring.config.import=optional:file:.env[.properties]

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://${HOST_DB}:${PORT_DB}/${NAME_DB}
spring.datasource.username=${USER_DB}
spring.datasource.password=${PASS_DB}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQL9Dialect
spring.jpa.generate-ddl=true
# Carrega relações lazy em lotes (evita dezenas de queries por listagem)
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# SWAGGER
springdoc.api-docs.path=/api-docs

# GEOAPIFY
geoapify.url=${GEOCODE_URL}
geoapify.key=${GEOCODE_KEY}

# Upload de IMG (R2)
r2.account.id=${R2_ACCOUNT_ID}
r2.access.key.id=${R2_ACCESS_KEY_ID}
r2.secret.access.key=${R2_SECRET_ACCESS_KEY}
r2.bucket.name=${R2_BUCKET_NAME}

# E-mail 
spring.mail.host=${EMAIL_HOST}
spring.mail.port=${EMAIL_PORT}
spring.mail.username=${EMAIL_USERNAME}
spring.mail.password=${EMAIL_PASS}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

# Pagamentos (gateway fake por enquanto)
# Percentual retido pela plataforma em cada pagamento (0.15 = 15%)
payment.platform.fee.percentage=${PLATFORM_FEE_PERCENTAGE:0.15}

# Chatbot (RAG sobre src/main/resources/kb) com Cloudflare Workers AI (free tier)
# Sem token, o chat funciona só com o texto dos guias (sem LLM).
cloudflare.ai.account-id=${CLOUDFLARE_AI_ACCOUNT_ID:${R2_ACCOUNT_ID:}}
cloudflare.ai.api-token=${CLOUDFLARE_AI_API_TOKEN:}
cloudflare.ai.model=${CLOUDFLARE_AI_MODEL:@cf/meta/llama-3.1-8b-instruct}
chat.rate-limit.per-client=${CHAT_RATE_LIMIT_PER_CLIENT:20}
chat.rate-limit.window-minutes=${CHAT_RATE_LIMIT_WINDOW_MINUTES:60}
chat.rate-limit.per-day=${CHAT_RATE_LIMIT_PER_DAY:2000}
chat.trust-forwarded-header=${CHAT_TRUST_FORWARDED_HEADER:false}

# Upload de imagens: fotos de celular passam fácil de 1 MB (limite padrão do Spring)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=60MB

# Respostas JSON menores
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript

# URL do site (front): usada nos links dos e-mails e no retorno do checkout simulado
app.frontend.url=${FRONTEND_URL:http://localhost:5173}
