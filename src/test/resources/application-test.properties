spring.application.name=conectaPro-api

# Banco H2 em memoria - nao depende de infraestrutura externa
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.generate-ddl=true

# SWAGGER
springdoc.api-docs.path=/api-docs

# GEOAPIFY - valores ficticios, nao usados no teste de contexto
geoapify.url=http://localhost/geoapify-test
geoapify.key=test-geoapify-key

# Upload de IMG - diretorio temporario para o teste
app.imagens.diretorio=/tmp/conectapro-test-uploads

# E-mail - valores ficticios, nao usados no teste de contexto
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test@example.com
spring.mail.password=test-password
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# JWT
jwt.secret=test-jwt-secret-not-for-production-use-only-for-ci
jwt.expiration=86400000
